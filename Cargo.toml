[workspace]
members = [
    "crates/ma2a-app",
    "crates/ma2a-core",
    "crates/ma2a-net",
    "crates/ma2a-runtime",
    "crates/ma2a-store",
    "xtask",
]
default-members = [
    "crates/ma2a-app",
    "crates/ma2a-core",
    "crates/ma2a-net",
    "crates/ma2a-runtime",
    "crates/ma2a-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
axum = "=0.8.9"
ed25519-dalek = "=3.0.0"
interprocess = "=2.4.3"
iroh = "=1.1.0"
iroh-base = "=1.1.0"
iroh-metrics = "=1.0.1"
iroh-ping = "=1.0.0"
iroh-relay = "=1.1.0"
iroh-tickets = "=1.0.0"
irpc = "=0.17.0"
irpc-iroh = "=0.17.0"
ma2a-core = { path = "crates/ma2a-core", version = "=0.1.0" }
ma2a-net = { path = "crates/ma2a-net", version = "=0.1.0" }
ma2a-runtime = { path = "crates/ma2a-runtime", version = "=0.1.0" }
ma2a-store = { path = "crates/ma2a-store", version = "=0.1.0" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.151"
tokio = "=1.53.1"
toml = "=1.1.4"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "deny"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
borrow_as_ptr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
empty_enum = "warn"
empty_structs_with_brackets = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
fn_to_numeric_cast_any = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
mod_module_files = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
panic = "deny"
ptr_as_ptr = "warn"
redundant_pub_crate = "allow"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
codegen-units = 256
debug = true
incremental = true
opt-level = 0
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.miri]
inherits = "test"
opt-level = 1
overflow-checks = true
