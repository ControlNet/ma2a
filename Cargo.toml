[workspace]
members = [
    "crates/ma2a-app",
    "crates/ma2a-core",
    "crates/ma2a-net",
    "crates/ma2a-runtime",
    "crates/ma2a-store",
    "xtask",
]
default-members = [
    "crates/ma2a-app",
    "crates/ma2a-core",
    "crates/ma2a-net",
    "crates/ma2a-runtime",
    "crates/ma2a-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash", "zeroize"] }
axum = "=0.8.9"
blake3 = "=1.8.7"
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
http = "=1.5.0"
interprocess = { version = "=2.4.3", features = ["tokio"] }
iroh = "=1.1.0"
iroh-base = "=1.1.0"
iroh-dns = "=1.1.0"
iroh-metrics = "=1.0.1"
iroh-ping = "=1.0.0"
iroh-relay = "=1.1.0"
iroh-tickets = "=1.0.0"
irpc = "=0.17.0"
irpc-iroh = "=0.17.0"
ma2a-core = { path = "crates/ma2a-core", version = "=0.1.0" }
ma2a-net = { path = "crates/ma2a-net", version = "=0.1.0" }
ma2a-runtime = { path = "crates/ma2a-runtime", version = "=0.1.0" }
ma2a-store = { path = "crates/ma2a-store", version = "=0.1.0" }
n0-future = "=0.3.2"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rcgen = "=0.14.9"
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "fallible_uint"] }
rpassword = "=7.5.4"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.15.1"
serde_json = "=1.0.151"
serde = "=1.0.229"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tokio = "=1.53.1"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = "=0.7.19"
toml = "=1.1.4"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
widestring = "=1.2.1"
windows-sys = "=0.61.2"
x509-parser = "=0.18.1"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "deny"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
borrow_as_ptr = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
empty_drop = "warn"
empty_enum = "warn"
empty_structs_with_brackets = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
fn_to_numeric_cast_any = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
mod_module_files = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
panic = "deny"
ptr_as_ptr = "warn"
redundant_pub_crate = "allow"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
codegen-units = 256
debug = true
incremental = true
opt-level = 0
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.miri]
inherits = "test"
opt-level = 1
overflow-checks = true
