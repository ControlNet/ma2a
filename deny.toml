[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0089",
    "RUSTSEC-2024-0436",
    # chrono is unmaintained (no vulnerability). It is reached only through iroh-relay's ACME
    # client (tokio-rustls-acme 0.9) and, on Windows, netwatch/wmi; no chrono release clears it.
    # iroh 1.5.0 drops the ACME path; netwatch keeps it. Review by 2027-05-20.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono via iroh-relay ACME and Windows netwatch; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "actix-web", reason = "MA2A uses Axum" },
    { name = "async-std", reason = "MA2A uses Tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
