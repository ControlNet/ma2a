name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.targets.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      - name: Derive supported release targets
        id: targets
        shell: bash
        run: |
          include=$(jq -c '
            [.targets[] | select(.status == "supported") | .target as $target |
              {
                target: $target,
                os: (
                  if $target == "x86_64-unknown-linux-gnu" then "ubuntu-latest"
                  elif $target == "aarch64-unknown-linux-gnu" then "ubuntu-24.04-arm"
                  elif $target == "x86_64-apple-darwin" then "macos-15-intel"
                  elif $target == "aarch64-apple-darwin" then "macos-14"
                  elif $target == "x86_64-pc-windows-msvc" then "windows-latest"
                  elif $target == "aarch64-pc-windows-msvc" then "windows-11-arm"
                  else error("unsupported target mapping: " + $target)
                  end
                ),
                archive: ("ma2a-app-" + $target + if ($target | endswith("pc-windows-msvc")) then ".zip" else ".tar.xz" end)
              }
            ]
          ' docs/platform-support.json)
          test "$(jq 'length' <<<"$include")" -gt 0
          printf 'include=%s\n' "$include" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Validate release policy
        shell: bash
        run: cargo run --locked -p xtask -- check-release
      - name: Build archive
        shell: bash
        run: bunx @axodotdev/dist@0.32.0 build --artifacts=local --target=${{ matrix.target }}
      - name: Validate archive and checksum
        shell: bash
        run: ./scripts/validate-release.sh "target/distrib/${{ matrix.archive }}" "${{ matrix.target }}"
      - name: Run extracted clean-room smoke
        shell: bash
        run: ./scripts/smoke-release.sh "target/distrib/${{ matrix.archive }}" "${{ matrix.target }}"
      - name: Generate dependency and license report
        shell: bash
        run: ./scripts/generate-license-report.sh "target/distrib/${{ matrix.archive }}.licenses.json"
      - name: Generate deterministic SPDX SBOM
        shell: bash
        run: RELEASE_CREATED_AT=$(git show -s --format=%cI "$GITHUB_SHA") ./scripts/generate-sbom.sh "target/distrib/${{ matrix.archive }}" "target/distrib/${{ matrix.archive }}.licenses.json" "target/distrib/${{ matrix.archive }}.spdx.json"
      - name: Validate SBOM and license report
        shell: bash
        run: ./scripts/validate-release-metadata.sh "target/distrib/${{ matrix.archive }}" "target/distrib/${{ matrix.archive }}.spdx.json" "target/distrib/${{ matrix.archive }}.licenses.json"
      - name: Run archive and metadata failure probes
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: ./scripts/test-release-failures.sh "target/distrib/${{ matrix.archive }}" "${{ matrix.target }}" "target/distrib/${{ matrix.archive }}.spdx.json" "target/distrib/${{ matrix.archive }}.licenses.json"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: target/distrib/${{ matrix.archive }}
      - name: Attest SPDX SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-path: target/distrib/${{ matrix.archive }}
          sbom-path: target/distrib/${{ matrix.archive }}.spdx.json
      - name: Preserve attestation bundles
        shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "target/distrib/${{ matrix.archive }}.provenance.sigstore.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" "target/distrib/${{ matrix.archive }}.sbom.sigstore.json"
      - name: Verify provenance and failure probes
        shell: bash
        run: |
          archive="target/distrib/${{ matrix.archive }}"
          provenance="${archive}.provenance.sigstore.json"
          sbom_attestation="${archive}.sbom.sigstore.json"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY" --bundle "$provenance" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY" --bundle "$sbom_attestation" --predicate-type https://spdx.dev/Document/v2.3 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          cp "$archive" target/distrib/tampered-artifact
          printf 'tampered' >> target/distrib/tampered-artifact
          if gh attestation verify target/distrib/tampered-artifact -R "$GITHUB_REPOSITORY" --bundle "$provenance"; then
            echo "tampered artifact unexpectedly verified" >&2
            exit 1
          fi
          rm target/distrib/tampered-artifact
          if gh attestation verify "target/distrib/${{ matrix.archive }}.licenses.json" -R "$GITHUB_REPOSITORY" --bundle "$provenance"; then
            echo "unattested metadata unexpectedly verified" >&2
            exit 1
          fi
      - name: Upload verified release unit
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            target/distrib/${{ matrix.archive }}
            target/distrib/${{ matrix.archive }}.sha256
            target/distrib/${{ matrix.archive }}.spdx.json
            target/distrib/${{ matrix.archive }}.licenses.json
            target/distrib/${{ matrix.archive }}.provenance.sigstore.json
            target/distrib/${{ matrix.archive }}.sbom.sigstore.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish archive-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
