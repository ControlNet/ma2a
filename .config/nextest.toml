[profile.default]
fail-fast = true
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "pass"
final-status-level = "flaky"

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "skip"
final-status-level = "pass"
