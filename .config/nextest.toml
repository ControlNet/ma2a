[test-groups]
ma2a-processes = { max-threads = 4 }

[profile.default]
test-threads = 4
fail-fast = true
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "pass"
final-status-level = "flaky"

[[profile.default.overrides]]
filter = "package(ma2a-app)"
test-group = "ma2a-processes"

[profile.ci]
test-threads = 4
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "skip"
final-status-level = "pass"

[profile.ci.junit]
path = "junit.xml"
[[profile.ci.overrides]]
filter = "package(ma2a-app)"
test-group = "ma2a-processes"
