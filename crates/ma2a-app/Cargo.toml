[package]
name = "ma2a-app"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ma2a"
path = "src/main.rs"

[dependencies]
ma2a-runtime.workspace = true

[dev-dependencies]
iroh.workspace = true
ma2a-core.workspace = true
ma2a-net.workspace = true
ma2a-store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["ma2a-runtime"]
