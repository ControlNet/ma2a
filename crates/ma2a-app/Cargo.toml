[package]
name = "ma2a-app"
build = "build.rs"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "ma2a"
path = "src/main.rs"

[dependencies]
ma2a-core.workspace = true
ma2a-runtime.workspace = true
ma2a-store.workspace = true
rpassword.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
zeroize.workspace = true

[dev-dependencies]
iroh-tickets.workspace = true
iroh.workspace = true
ma2a-net.workspace = true
ma2a-store.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["ma2a-runtime"]
