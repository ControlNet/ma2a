[package]
name = "ma2a-runtime"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum.workspace = true
blake3.workspace = true
getrandom.workspace = true
hyper-util = { version = "=0.1.20", features = ["server-auto", "service", "tokio"] }
interprocess.workspace = true
ma2a-core.workspace = true
ma2a-net.workspace = true
ma2a-store.workspace = true
iroh-tickets.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = "=0.1.19"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
iroh.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["axum"]
